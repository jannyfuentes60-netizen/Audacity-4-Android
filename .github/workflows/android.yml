name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "packaging/**"
      - ".github/workflows/android.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    name: Build Audacity 4 Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Andacious submodule
        run: |
          test -f vendor/Andacious/gradlew
          test -f vendor/Andacious/app/src/main/assets/apps/andacious/andacious.sh

      - name: Inject Audacity 4.0.2 launcher
        run: |
          install -m 0755 packaging/andacious.sh vendor/Andacious/app/src/main/assets/apps/andacious/andacious.sh

      - name: Build debug APK
        working-directory: vendor/Andacious
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audacity-4-Android-debug
          path: vendor/Andacious/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
