name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - ".github/workflows/android.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    name: Build Audacity 4 Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Android compatibility layer
        run: |
          git clone --depth 1 https://github.com/CypherpunkArmory/Andacious.git vendor/Andacious
          test -f vendor/Andacious/gradlew

      - name: Download matching UserLAnd runtime source
        run: |
          rm -rf vendor/Andacious/UserLAndLibrary
          mkdir -p vendor/Andacious/UserLAndLibrary
          if git -C vendor/Andacious/UserLAndLibrary init && \
             git -C vendor/Andacious/UserLAndLibrary remote add origin https://github.com/CypherpunkArmory/UserLAndLibrary.git && \
             git -C vendor/Andacious/UserLAndLibrary fetch --depth 1 origin 513c819aafd62cb6a1028a6dfba8d0bb02c3904f && \
             git -C vendor/Andacious/UserLAndLibrary checkout FETCH_HEAD; then
            git -C vendor/Andacious/UserLAndLibrary submodule update --init --recursive || true
          else
            rm -rf vendor/Andacious/UserLAndLibrary
            git clone --depth 1 --recurse-submodules https://github.com/pp-sepag/UserLAndLibrary.git vendor/Andacious/UserLAndLibrary
          fi
          test -f vendor/Andacious/UserLAndLibrary/app/build.gradle

      - name: Restore FreeRDP Android core source
        run: |
          FREERDP_DIR="vendor/Andacious/UserLAndLibrary/remote-desktop-clients/remoteClientLib/jni/libs/deps/FreeRDP"
          if [ ! -f "$FREERDP_DIR/client/Android/Studio/freeRDPCore/build.gradle" ]; then
            mkdir -p "$(dirname "$FREERDP_DIR")"
            git clone --depth 1 --branch 2.11.7 https://github.com/FreeRDP/FreeRDP.git "$FREERDP_DIR"
          fi
          test -f "$FREERDP_DIR/client/Android/Studio/freeRDPCore/build.gradle"
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("vendor/Andacious/UserLAndLibrary/remote-desktop-clients/remoteClientLib/jni/libs/deps/FreeRDP/client/Android/Studio/freeRDPCore/build.gradle")
          source = gradle.read_text()
          source = source.replace("compileSdkVersion = rootProject.ext.compileApi", "compileSdkVersion 35")
          source = source.replace("buildToolsVersion = rootProject.ext.toolsVersion", "buildToolsVersion '35.0.0'")
          source = source.replace("minSdkVersion rootProject.ext.minApi", "minSdkVersion 21")
          source = source.replace("targetSdkVersion rootProject.ext.targetApi", "targetSdkVersion 28")
          if "rootProject.ext." in source:
              raise SystemExit("FreeRDP core still references missing root Gradle properties")
          gradle.write_text(source)

          manifest = Path("vendor/Andacious/UserLAndLibrary/remote-desktop-clients/remoteClientLib/jni/libs/deps/FreeRDP/client/Android/Studio/freeRDPCore/src/main/AndroidManifest.xml")
          lines = manifest.read_text().splitlines()
          for index, line in enumerate(lines):
              if "<activity-alias" in line:
                  if index + 1 < len(lines) and 'android:name=".presentation.CreateShortcuts"' in lines[index + 1]:
                      if not any('android:exported=' in item for item in lines[index:index + 3]):
                          lines.insert(index + 1, '            android:exported="true"')
                      break
          else:
              raise SystemExit("Could not find FreeRDP CreateShortcuts activity-alias")
          manifest.write_text(chr(10).join(lines) + chr(10))
          PY

      - name: Patch obsolete SSH key encoding API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("vendor/Andacious/UserLAndLibrary/remote-desktop-clients/pubkeyGenerator/build.gradle")
          source = gradle.read_text().replace("org.connectbot:sshlib:2.2.13", "org.connectbot:sshlib:2.2.23")
          gradle.write_text(source)

          java = Path("vendor/Andacious/UserLAndLibrary/remote-desktop-clients/pubkeyGenerator/src/main/java/com/iiordanov/pubkeygenerator/PubkeyUtils.java")
          source = java.read_text()
          if "import com.trilead.ssh2.packets.TypesWriter;" not in source:
              source = source.replace("import com.trilead.ssh2.crypto.PEMStructure;" + chr(10), "import com.trilead.ssh2.crypto.PEMStructure;" + chr(10) + "import com.trilead.ssh2.packets.TypesWriter;" + chr(10))
          source = source.replace("RSASHA1Verify.encodeSSHRSAPublicKey((RSAPublicKey)pk)", "encodeSshRsaPublicKey((RSAPublicKey)pk)")
          source = source.replace("DSASHA1Verify.encodeSSHDSAPublicKey((DSAPublicKey)pk)", "encodeSshDsaPublicKey((DSAPublicKey)pk)")
          marker = "    public static String convertToOpenSSHFormat(PublicKey pk, String origNickname)"
          helper_lines = [
              "    private static byte[] encodeSshRsaPublicKey(RSAPublicKey key) throws IOException {",
              "        TypesWriter writer = new TypesWriter();",
              '        writer.writeString("ssh-rsa");',
              "        writer.writeMPInt(key.getPublicExponent());",
              "        writer.writeMPInt(key.getModulus());",
              "        return writer.getBytes();",
              "    }",
              "",
              "    private static byte[] encodeSshDsaPublicKey(DSAPublicKey key) throws IOException {",
              "        DSAParams params = key.getParams();",
              "        TypesWriter writer = new TypesWriter();",
              '        writer.writeString("ssh-dss");',
              "        writer.writeMPInt(params.getP());",
              "        writer.writeMPInt(params.getQ());",
              "        writer.writeMPInt(params.getG());",
              "        writer.writeMPInt(key.getY());",
              "        return writer.getBytes();",
              "    }",
              ""
          ]
          helpers = chr(10).join(helper_lines)
          if "private static byte[] encodeSshRsaPublicKey" not in source:
              if marker not in source:
                  raise SystemExit("Could not locate OpenSSH key conversion method")
              source = source.replace(marker, helpers + marker, 1)
          java.write_text(source)
          PY

      - name: Remove obsolete Android WebView AppCache API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("vendor/Andacious/UserLAndLibrary/termux-app/app/src/main/java/com/termux/app/TermuxHelpActivity.java")
          source = path.read_text()
          lines = source.splitlines()
          matches = [line for line in lines if "setAppCacheEnabled(false)" in line]
          if len(matches) != 1:
              raise SystemExit(f"Expected one obsolete WebView AppCache call, found {len(matches)}")
          lines = [line for line in lines if "setAppCacheEnabled(false)" not in line]
          path.write_text(chr(10).join(lines) + chr(10))
          PY

      - name: Update Moshi codegen for Kotlin metadata compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("vendor/Andacious/UserLAndLibrary/app/build.gradle")
          source = path.read_text()
          old = "def moshi_version = '1.12.0'"
          if old not in source:
              raise SystemExit("Could not find pinned Moshi version")
          path.write_text(source.replace(old, "def moshi_version = '1.14.0'", 1))
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Inject Audacity 4.0.2 launcher and app name
        run: |
          install -m 0755 packaging/andacious.sh vendor/Andacious/app/src/main/assets/apps/andacious/andacious.sh
          sed -i 's#<string name="app_name">Andacious</string>#<string name="app_name">Audacity 4 Android</string>#' vendor/Andacious/app/src/main/res/values/strings.xml

      - name: Patch legacy Android module namespaces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path("vendor/Andacious")
          patched = []
          for gradle in root.rglob("build.gradle"):
              source = gradle.read_text(errors="replace")
              if "com.android.library" not in source and "com.android.application" not in source:
                  continue
              if re.search(r"\bnamespace\s*[= ]", source):
                  continue
              manifest = gradle.parent / "src/main/AndroidManifest.xml"
              if not manifest.exists():
                  continue
              try:
                  package = ET.parse(manifest).getroot().attrib.get("package")
              except ET.ParseError:
                  continue
              if not package:
                  continue
              updated, count = re.subn(r"(android\s*\{)", r"\1\n    namespace '" + package + "'", source, count=1)
              if count:
                  gradle.write_text(updated)
                  patched.append(f"{gradle}: {package}")
          print("\n".join(patched) if patched else "No legacy Android namespaces required patching")
          PY

      - name: Remove obsolete Bintray publishing plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("vendor/Andacious")
          markers = ("com.jfrog.bintray", "com.github.dcendents.android-maven", "bintray-publish.gradle")
          changed = []
          for path in root.rglob("build.gradle"):
              original = path.read_text(errors="replace")
              lines = [line for line in original.splitlines() if not any(marker in line for marker in markers)]
              updated = "\n".join(lines) + "\n"
              updated = re.sub(r"(?ms)^\s*plugins\s*\{\s*\}\s*", "", updated)
              if updated != original:
                  path.write_text(updated)
                  changed.append(str(path))
          print("\n".join(changed) if changed else "No obsolete Bintray plugins found")
          PY

      - name: Update obsolete JaCoCo report DSL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("vendor/Andacious/UserLAndLibrary/app/build.gradle")
          source = path.read_text()
          source = source.replace("xml.enabled = true", "xml.required.set(true)")
          source = source.replace("html.enabled = true", "html.required.set(true)")
          path.write_text(source)
          PY

      - name: Enable legacy UserLAnd build features and compatible Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("vendor/Andacious")
          # Kotlin Android Extensions synthetic views were removed in Kotlin 2.x.
          # Keep the legacy UserLAnd source on a compatible Kotlin plugin.
          for gradle in (root / "build.gradle", root / "UserLAndLibrary/build.gradle"):
              if not gradle.exists():
                  continue
              source = gradle.read_text()
              source = re.sub(r"""kotlin_version\s*=\s*(['"])[0-9][^'"]*\1""", "kotlin_version = '1.8.22'", source)
              source = source.replace('classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"', 'classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22"')
              gradle.write_text(source)

          # Pin any nested Kotlin buildscript declarations as well.
          for gradle in root.rglob("build.gradle"):
              source = gradle.read_text(errors="replace")
              source = source.replace('org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version', 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22')
              source = re.sub(r'org.jetbrains.kotlin:kotlin-gradle-plugin:[0-9.]+', 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22', source)
              gradle.write_text(source)
          print("Pinned all Kotlin Gradle plugin declarations to 1.8.22")

          # Force every Kotlin compiler/plugin artifact to the K1-compatible version
          # required by the legacy UserLAnd Android Extensions source.
          root_build = root / "build.gradle"
          root_source = root_build.read_text()
          force_line = "    configurations.classpath.resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22', 'org.jetbrains.kotlin:kotlin-compiler-embeddable:1.8.22'\n"
          if "kotlin-compiler-embeddable:1.8.22" not in root_source:
              root_source = root_source.replace("buildscript {", "buildscript {\n" + force_line, 1)
              root_build.write_text(root_source)

          # Keep the legacy K1 compiler path; Android Extensions is incompatible with K2.
          props = root / "gradle.properties"
          props_source = props.read_text()
          if "kotlin.experimental.tryK2=" not in props_source:
              props_source += "\nkotlin.experimental.tryK2=false\nkapt.use.k2=false\n"
          props.write_text(props_source)

          # AGP 8 disables BuildConfig generation by default in library modules.
          module = root / "UserLAndLibrary/app/build.gradle"
          source = module.read_text()
          if not re.search(r"buildConfig\s+(?:true|=\s*true)", source):
              if re.search(r"buildFeatures\s*\{", source):
                  source, count = re.subn(r"(buildFeatures\s*\{)", r"\1\n        buildConfig true", source, count=1)
                  if not count:
                      raise SystemExit("Could not add BuildConfig to existing buildFeatures block")
              else:
                  source, count = re.subn(r"(android\s*\{)", r"\1\n    buildFeatures { buildConfig true }", source, count=1)
                  if not count:
                      raise SystemExit("Could not locate android block to enable BuildConfig")
              module.write_text(source)

          app_gradle = root / "UserLAndLibrary/app/build.gradle"
          app_source = app_gradle.read_text()
          if "kotlinOptions {" not in app_source:
              app_source, count = re.subn(r"(android\s*\{)", r"\1\n    kotlinOptions { jvmTarget = '1.8' }", app_source, count=1)
              if not count:
                  raise SystemExit("Could not configure Kotlin JVM target in Android module")
          if "kotlin-android-extensions" not in app_source:
              app_source = app_source.replace("apply plugin: 'kotlin-android'\n", "apply plugin: 'kotlin-android'\n\napply plugin: 'kotlin-android-extensions'\n", 1)
          # Kapt creates a separate Kotlin stub task; set its bytecode target explicitly.
          if "kaptGenerateStubs" not in app_source:
              app_source += "\ntasks.matching { it.name.startsWith('kaptGenerateStubs') }.configureEach { kotlinOptions.jvmTarget = '1.8' }\n"
          app_gradle.write_text(app_source)

          # Restore the legacy DSL, now that the compiler is explicitly pinned to Kotlin 1.8.22.
          if "androidExtensions {" not in app_source:
              app_source += "\n\nandroidExtensions {\n    experimental = true\n}\n"
              app_gradle.write_text(app_source)

          PY

      - name: Build debug APK
        working-directory: vendor/Andacious
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audacity-4-Android-debug
          path: vendor/Andacious/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
